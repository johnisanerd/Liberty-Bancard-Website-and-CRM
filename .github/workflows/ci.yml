name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── Static job: typecheck + file-scan suites (no DB, no network) ────────────
  static:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://static-test:static-test@127.0.0.1:1/static_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Install scanner dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Verify locked dependency policy and toolchain evidence
        run: |
          test "$(node --version)" = "v22.22.0"
          test "$(npm --version)" = "10.9.4"
          npx tsx scripts/test-dependency-policy-evidence.ts
          npx tsx scripts/test-inventory-artifact-dependencies.ts
          npx tsx scripts/dependency-policy-evidence.ts --output dependency-policy-evidence.json

      - name: Validate canonical suite manifest
        run: npx tsx scripts/ci-suite-manifest.ts --check

      - name: Run all deterministic static suites
        env:
          DATABASE_URL: postgresql://ci-static:ci-static@127.0.0.1:1/ci_static?connect_timeout=1
        run: npx tsx scripts/run-ci-suites.ts --capability deterministic-static

      - name: Run restricted external dependency audit
        run: npx tsx scripts/run-ci-suites.ts --capability external-security

      - name: Build and scan the release artifact
        run: npx tsx scripts/run-ci-suites.ts --capability writable-build

  # ── Integration job: DB + Redis; GHL and live providers are blocked ─────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: static

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      TEST_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      GHL_TRANSPORT_FAILFAST: "true"
      SUNBIZ_ENRICHMENT_ENABLED: "false"
      SERPER_GATEWAY_ENABLED: "false"
      SESSION_SECRET: ci-test-secret-32chars-minimum-ok
      CREDENTIAL_ENCRYPTION_KEY: ci-test-encryption-key-32chars-ok
      MERCHANT_DATA_ENCRYPTION_KEY: ci-test-merchant-key-32chars-min
      AI_INTEGRATIONS_OPENAI_API_KEY: ci-test-openai-key-unused
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://127.0.0.1:1/v1
      ADMIN_SEED_EMAIL: ci-admin@libertybancard.test
      ADMIN_SEED_PASSWORD: ci-admin-password-Aa1!
      ADMIN_SEED_FORCE_UPDATE: "true"
      TEST_USER_EMAIL: ci-admin@libertybancard.test
      TEST_USER_PASSWORD: ci-admin-password-Aa1!

    steps:
      - uses: actions/checkout@v4

      - name: Install scanner dependency
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Verify locked dependency policy and toolchain evidence
        run: |
          test "$(node --version)" = "v22.22.0"
          test "$(npm --version)" = "10.9.4"
          npx tsx scripts/test-dependency-policy-evidence.ts
          npx tsx scripts/test-inventory-artifact-dependencies.ts
          npx tsx scripts/dependency-policy-evidence.ts --output dependency-policy-evidence.json

      - name: Generate unique Redis namespace
        run: echo "TEST_REDIS_PREFIX=$(npx tsx scripts/generate-certification-redis-prefix.ts)" >> "$GITHUB_ENV"

      - name: Prepare private Chromium for registered browser suites
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 redis-server
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          sudo mkdir -p /repl/tools/bin
          sudo ln -s "$chrome_bin" /repl/tools/bin/chromium


      - name: Verify certification process isolation
        run: |
          npx tsx scripts/test-certification-process-env.ts
          npx tsx scripts/test-certification-provider-deny.ts
          npx tsx scripts/test-certification-server-readiness.ts
          npx tsx scripts/test-certification-redis-reservation.ts

      - name: Run database migrations from empty database
        run: npx tsx scripts/run-guarded-canonical-migration.ts

      - name: Re-run database migrations to prove idempotency
        run: npx tsx scripts/run-guarded-canonical-migration.ts

      - name: Validate canonical suite manifest
        run: npx tsx scripts/ci-suite-manifest.ts --check

      - name: Build exact production candidate for integration acceptance
        # Integration runs in a fresh job, not the static job's isolated build
        # workspace. Build the exact candidate here; never substitute an old
        # receipt or relax reader/browser integrity verification.
        # The build-only process sets production mode while this job's DB,
        # sessions and test runner remain in test mode.
        env:
          VG_PROVIDER_DENY_MODE: "1"
          CERTIFICATION_COMPILER_ONLY: "1"
          CERTIFICATION_ALLOWED_NETWORK_ORIGINS: ""
          CERTIFICATION_ALLOW_LOOPBACK: "0"
        run: NODE_OPTIONS="${NODE_OPTIONS:-} --require $(pwd)/scripts/certification-provider-deny-preload.cjs" npm run build

      - name: Build matched original production baseline
        env:
          VG_PROVIDER_DENY_MODE: "1"
          CERTIFICATION_COMPILER_ONLY: "1"
          CERTIFICATION_ALLOWED_NETWORK_ORIGINS: ""
          CERTIFICATION_ALLOW_LOOPBACK: "0"
        run: |
          git fetch origin 85296699ec8d11f22750657dfe5ac34a8fd2577d
          git worktree add --detach ../c4-performance-baseline 85296699ec8d11f22750657dfe5ac34a8fd2577d
          ln -s "$PWD/node_modules" ../c4-performance-baseline/node_modules
          deny_preload="$PWD/scripts/certification-provider-deny-preload.cjs"
          (cd ../c4-performance-baseline && NODE_OPTIONS="${NODE_OPTIONS:-} --require $deny_preload" npm run build)

      - name: Run all deterministic integration suites
        run: npx tsx scripts/run-ci-suites.ts --capability deterministic-integration

      - name: Start disposable CI application server
        run: |
          npx tsx scripts/run-denied-certification-server.ts > ci-server.log 2>&1 &
          echo $! > ci-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health >/dev/null; then
              break
            fi
            if ! kill -0 "$(cat ci-server.pid)" 2>/dev/null; then
              echo "CI server exited before becoming healthy"
              cat ci-server.log
              exit 1
            fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:5000/api/health >/dev/null; then
            echo "CI server did not become healthy"
            cat ci-server.log
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if psql "$DATABASE_URL" -tAc \
              "SELECT 1 FROM users WHERE lower(email) = lower('$ADMIN_SEED_EMAIL') LIMIT 1" \
              | grep -q 1; then
              exit 0
            fi
            if ! kill -0 "$(cat ci-server.pid)" 2>/dev/null; then
              echo "CI server exited before admin seeding completed"
              cat ci-server.log
              exit 1
            fi
            sleep 1
          done
          echo "CI admin seeding did not complete"
          cat ci-server.log
          exit 1

      - name: Run all server-required suites
        run: |
          if ! kill -0 "$(cat ci-server.pid)" 2>/dev/null; then
            echo "CI server exited after readiness but before server-required suites"
            cat ci-server.log
            exit 1
          fi
          if ! npx tsx scripts/run-ci-suites.ts --capability server-required; then
            echo "Server-required suite failure; isolated server log follows"
            cat ci-server.log
            exit 1
          fi
          if ! kill -0 "$(cat ci-server.pid)" 2>/dev/null; then
            echo "CI server exited during server-required suites"
            cat ci-server.log
            exit 1
          fi

      - name: Stop disposable CI application server
        if: always()
        run: |
          if [ -f ci-server.pid ]; then
            server_pid="$(cat ci-server.pid)"
            kill "$server_pid" 2>/dev/null || true
            for attempt in $(seq 1 10); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                wait "$server_pid" 2>/dev/null || true
                exit 0
              fi
              sleep 1
            done
            kill -9 "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if kill -0 "$server_pid" 2>/dev/null; then
              echo "Owned CI server did not terminate"
              exit 1
            fi
          fi
